name: Release v0.4.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish v0.4.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "0.4.0" ]; then
            echo "package.json is version $VERSION; this workflow only publishes v0.4.0."
            exit 1
          fi

      - name: Build installable package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          test -f homebridge-eufy-clean-0.4.0.tgz
          git archive --format=tar.gz --prefix=homebridge-eufy-clean-0.4.0/ -o homebridge-eufy-clean-0.4.0-source.tar.gz HEAD
          sha256sum homebridge-eufy-clean-0.4.0.tgz homebridge-eufy-clean-0.4.0-source.tar.gz | tee SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Homebridge Eufy Clean v0.4.0

          Matter room-selection release of **homebridge-eufy-clean**, created and maintained by **@gstrosnider**.

          ## Highlights

          - Native Matter `RoboticVacuumCleaner` support on compatible Homebridge 2.x installations.
          - Selectable rooms through the Matter Service Area cluster.
          - Automatic decoded Eufy room/map discovery where the active transport exposes it.
          - Manual per-device `rooms` and `mapId` fallback, particularly useful for Tuya Cloud/local connections.
          - Selected-room protobuf control for newer Eufy API devices including the X8 Pro SES / T2276 when connected through the compatible API generation.
          - Automatic HAP/HomeKit fallback when Matter is disabled or unavailable.
          - Start cleaning from HomeKit/Matter.
          - Turning the vacuum off/idle stops or pauses cleaning and returns it to the dock.
          - Read-only battery percentage, charging state, and low-battery status.
          - Automatic Eufy account discovery with Cloud, MQTT/AIOT, and legacy Tuya handling.
          - Optional local Tuya control for compatible older RoboVacs using device ID, IP address, and local key.
          - Runtime discovery is designed to support both legacy and newer Eufy RoboVac generations without rejecting unknown model identifiers solely because they are absent from a static model list.

          ## Matter scope

          Matter exposes start, pause/resume, return home, operational state, battery state, a conservative vacuum cleaning mode, and room selection when room metadata is available. Scenes, suction presets, mop settings, consumables, and advanced dock controls are not included.

          ## Installation

          Download `homebridge-eufy-clean-0.4.0.tgz` from the Assets section and install it with npm on the Homebridge host. A matching source archive is also attached.

          The release also includes `SHA256SUMS.txt` for package verification. GitHub automatically provides source `.zip` and `.tar.gz` archives for this tag.

          ## Compatibility note

          Eufy does not provide a stable public API for every RoboVac generation. Broad compatibility is implemented through the upstream `eufy-clean` SDK and multiple transport paths, but individual models or future Eufy API changes may require additional work.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.4.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the existing release unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            homebridge-eufy-clean-0.4.0.tgz \
            homebridge-eufy-clean-0.4.0-source.tar.gz \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Homebridge Eufy Clean v0.4.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
